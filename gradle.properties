# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true

# ForgeGradle merges the client / server source sets into one compile classpath
# so that a single `main` source set can hold both common and client-only code.
net.minecraftforge.gradle.merge-source-sets=true

# ---------------------------------------------------------------------------
# Project coordinates (consumed by build.gradle)
# ---------------------------------------------------------------------------
mod_id=ultimatelife
mod_name=Ultimate Life
mod_group=com.ultimatelife
mod_authors=Ultimate Life Team
mod_description=A life-simulation framework for Minecraft.
mod_version=0.1.0

# ---------------------------------------------------------------------------
# Toolchain / platform versions
# ---------------------------------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
forge_version=52.1.16
forge_version_range=[52,)
loader_version_range=[52,)
java_version=21
