# Ultimate Life - Forge mod descriptor
# https://docs.minecraftforge.net/en/1.21.x/gettingstarted/modfiles/#modstoml

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "All Rights Reserved"
#issueTrackerURL = "https://github.com/your-org/ultimate-life/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
#displayURL = "https://example.com/"
#logoFile = "logo.png"
credits = "Built on Minecraft Forge for Minecraft ${minecraft_version}."

# This mod adds blocks, items and (later) entities. Both ends must run it, so the default
# MATCH_VERSION display test is the correct choice - do not relax it while the mod adds
# content.
displayTest = "MATCH_VERSION"

# Opt out of the default access-transformer lookup: the mod has none, and saying so
# explicitly avoids the scan.
accessTransformers = []

description = '''${mod_description}

Phase 1 delivers the foundation only: mod bootstrap, registry scaffolding, Forge config,
a versioned network channel, data generation and a creative tab. Content systems
(furniture, backpacks, storage, NPCs, mail, economy, vehicles) build on top of it in later
phases.'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
