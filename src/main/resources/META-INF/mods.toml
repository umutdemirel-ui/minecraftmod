# Ultimate Life - Minecraft Forge 1.21.1
# Values in ${...} are expanded from gradle.properties at build time.
# Reference: https://docs.minecraftforge.net/en/1.21.x/gettingstarted/modfiles/#modstoml

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/umutdemirel-ui/minecraftmod/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# Access transformers: none yet. Declaring an empty list opts out of the default lookup.
accessTransformers = []

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
